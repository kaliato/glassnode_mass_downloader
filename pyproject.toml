[project]
name = "glassnode-mass-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaliato", email = "kaliatojp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=18.0",
    "requests>=2.32",
]

[project.scripts]
glassnode-mass-downloader = "glassnode_mass_downloader:main"
glassnode-download-metrics-file = "glassnode_mass_downloader.metrics_file_downloader:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
